name: Execute releasability checks

on:
  workflow_dispatch:
    inputs:
      organization:
        description: "GitHub organization (any org in the Sonar GitHub Enterprise)"
        required: true
        default: "SonarSource"
        type: string
      repository:
        description: "GitHub repository"
        required: true
        type: string
      branch:
        description: "Branch"
        default: "master"
        required: true
        type: string
      version:
        description: "The version to check"
        required: true
        type: string
      commit-sha:
        description: "Commit SHA"
        required: true
        type: string
      artifactory-build-name:
        description: "Optional Artifactory build name override (defaults to repository name)"
        required: false
        type: string
      releasabily-env:
        description: "For development purposes, the environment to use. Defaults to production."
        required: false
        default: prod
        type: choice
        options:
          - prod
          - staging
          - dev

jobs:
  trigger_releasability_checks:
    runs-on: github-ubuntu-latest-s
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Trigger releasability checks
        uses: ./
        with:
          organization: ${{ github.event.inputs.organization }}
          repository: ${{ github.event.inputs.repository }}
          branch: ${{ github.event.inputs.branch }}
          version: ${{ github.event.inputs.version }}
          commit-sha: ${{ github.event.inputs.commit-sha }}
          artifactory-build-name: ${{ github.event.inputs.artifactory-build-name }}
          releasabily-env: ${{ github.event.inputs.releasabily-env }}
