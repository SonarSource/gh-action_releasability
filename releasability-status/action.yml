# yamllint disable rule:line-length
---
name: Releasability status
description: Run releasability checks and update commit status
inputs:
  optional_checks:
    description: 'Comma separated list of checks to ignore in case of failure'
    required: false
    default: ''
runs:
  using: "composite"
  steps:
    # config-pip must run before setup-python: setup-python's own pip upgrade step
    # hits public PyPI directly, which fails when direct PyPI/registry egress is blocked.
    # It also exports the Artifactory credentials used by the scoped Pipenv mirrors below.
    - uses: SonarSource/ci-github-actions/config-pip@v1

    - id: setup_python
      name: Setup python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: "3.14"

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
      with:
        aws-region: eu-central-1
        role-to-assume: "arn:aws:iam::064493320159:role/deploymentroles/ReleasbilityChecksCICDRoleV2"

    - name: Install requirements
      run: pip install pipenv
      shell: bash

    # Find latest promoted version from the commit status
    - id: find_version
      continue-on-error: true
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        ./find_version.sh

    - name: Check if version was found
      if: steps.find_version.outcome != 'success'
      shell: bash
      run: |
        echo "Version not found. Skipping releasability checks."
        echo "This is expected if no version has been promoted yet."
        exit 0

    # Required by inline CheckVersionConsistency (same as root action.yml).
    # releasability-status invokes pipenv run releasability directly and does not
    # go through the root composite action, so credentials must be fetched here.
    - name: Fetch Artifactory credentials for inline checks
      if: steps.find_version.outcome == 'success'
      id: artifactory_secrets
      uses: SonarSource/vault-action-wrapper@881045d830534a70ec3c7c275fa3714412c8ff6e # 3.6.1
      with:
        secrets: |
          development/artifactory/token/{REPO_OWNER_NAME_DASH}-private-reader username | ARTIFACTORY_USERNAME;
          development/artifactory/token/{REPO_OWNER_NAME_DASH}-private-reader access_token | ARTIFACTORY_ACCESS_TOKEN;

    - name: Trigger releasability checks
      if: steps.find_version.outcome == 'success'
      id: checks
      shell: bash
      working-directory: ${{ github.action_path }}/../
      run: |
        pipenv_mirror_host="repox.jfrog.io/artifactory/api/pypi/sonarsource-pypi/simple"
        pipenv_mirror="https://${ARTIFACTORY_USERNAME}:${ARTIFACTORY_ACCESS_TOKEN}@${pipenv_mirror_host}"
        echo "::add-mask::$pipenv_mirror"
        PIPENV_PYPI_MIRROR="$pipenv_mirror" pipenv install --deploy
        pipenv run releasability
      env:
        INPUT_ORGANIZATION: ${{ github.repository_owner }}
        INPUT_REPOSITORY: ${{ github.event.repository.name }}
        INPUT_BRANCH: ${{ github.ref_name }}
        INPUT_VERSION: ${{ steps.find_version.outputs.version }}
        INPUT_COMMIT_SHA: ${{ github.sha }}
        # Same Repox base URL as gh-action_release / root action.yml
        ARTIFACTORY_URL: https://repox.jfrog.io/repox
        ARTIFACTORY_USERNAME: ${{ fromJSON(steps.artifactory_secrets.outputs.vault).ARTIFACTORY_USERNAME }}
        ARTIFACTORY_ACCESS_TOKEN: ${{ fromJSON(steps.artifactory_secrets.outputs.vault).ARTIFACTORY_ACCESS_TOKEN }}
        PYTHONUNBUFFERED: "1" # that way logs are printed live

    - name: Parse Releasability check output
      id: parse-releasability
      if: always() && steps.find_version.outputs.version != ''
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        INPUT_VERSION: ${{ steps.find_version.outputs.version }}
        RELEASABILITY_CHECK_RESULT: ${{ toJSON(steps.checks.outputs) }}
        OPTIONAL_CHECKS: ${{ inputs.optional_checks }}
      run: |
        pipenv_mirror_host="repox.jfrog.io/artifactory/api/pypi/sonarsource-pypi/simple"
        pipenv_mirror="https://${ARTIFACTORY_USERNAME}:${ARTIFACTORY_ACCESS_TOKEN}@${pipenv_mirror_host}"
        echo "::add-mask::$pipenv_mirror"
        PIPENV_PYPI_MIRROR="$pipenv_mirror" pipenv install --deploy
        pipenv run releasability-status

    - name: Print results
      if: steps.find_version.outputs.version != ''
      env:
        LOGS_OUTPUT: ${{ steps.checks.outputs.logs }}
        EXIT_CODE: ${{ steps.parse-releasability.outputs.status }}
        MESSAGE_OUTPUT: ${{ steps.parse-releasability.outputs.message }}
      run: |
        echo "Releasability Check Results:"
        echo "=========================="
        echo "$LOGS_OUTPUT"
        echo "Exit code: $EXIT_CODE"
        echo "Message: $MESSAGE_OUTPUT"
        echo "=========================="
      shell: bash

    - uses: octokit/request-action@b91aabaa861c777dcdb14e2387e30eddf04619ae # v3.0.0
      name: Update Commit status to success
      if: steps.find_version.outputs.version != ''
      with:
        route: 'POST /repos/${{ github.repository_owner }}/${{ github.event.repository.name }}/statuses/${{ github.sha }}'
      env:
        GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
        INPUT_STATE: "${{ steps.parse-releasability.outputs.state }}"
        INPUT_TARGET_URL: "https://github.com/${{ github.repository_owner }}/${{ github.event.repository.name }}/actions/runs/${{ github.run_id }}"
        INPUT_DESCRIPTION: "${{ steps.parse-releasability.outputs.message }}"
        INPUT_CONTEXT: "Releasability"
